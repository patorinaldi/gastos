spring:
  application:
    name: gastos
  mvc:
    problemdetails:
      enabled: true

# Solo /actuator/health queda expuesto, y sin detalle de componentes: el detalle
# revela nombres de host, esquemas y estado interno de las dependencias.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: 8080
