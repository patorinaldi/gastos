spring:
  application:
    name: gastos
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gastos}
    username: ${DB_API_USERNAME:gastos_api}
    password: ${DB_API_PASSWORD:gastos_api}
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gastos}
    user: ${DB_ADMIN_USERNAME:gastos}
    password: ${DB_ADMIN_PASSWORD:gastos}
    placeholders:
      api_password: ${DB_API_PASSWORD:gastos_api}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Solo /actuator/health queda expuesto, y sin detalle de componentes: el detalle
# revela nombres de host, esquemas y estado interno de las dependencias.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: 8080

# Implementación de EmailSender. "console" escribe los correos en el log en lugar de
# enviarlos: sirve solo en desarrollo, porque ahí quedan los enlaces con tokens de
# verificación y recuperación de contraseña.
gastos:
  email:
    sender: ${EMAIL_SENDER:console}
