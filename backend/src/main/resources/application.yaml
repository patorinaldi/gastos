spring:
  application:
    name: gastos
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gastos}
    username: ${DB_API_USERNAME:gastos_api}
    password: ${DB_API_PASSWORD:gastos_api}
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gastos}
    user: ${DB_ADMIN_USERNAME:gastos}
    password: ${DB_ADMIN_PASSWORD:gastos}
    placeholders:
      api_password: ${DB_API_PASSWORD:gastos_api}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Servidor SMTP, para gastos.email.sender=smtp. Con console no se usa. Los tiempos de espera van
  # en milisegundos: sin ellos, un servidor que no responde deja el envío esperando para siempre.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  # Los correos se envían en segundo plano (ver PasswordResetService y EmailVerificationService).
  # Al apagarse, la aplicación espera a que salgan los pendientes: si no, un reinicio o un
  # despliegue los descartaría sin aviso, después de haberle respondido a quien los pidió.
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 30s

# Solo /actuator/health queda expuesto, y sin detalle de componentes: el detalle
# revela nombres de host, esquemas y estado interno de las dependencias.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # Sin esto, el health consulta al servidor SMTP: con console no hay servidor y el health daría
  # DOWN, y con smtp una caída del proveedor tiraría el despliegue, que se verifica contra el
  # health. Un correo que no sale queda en el log; la API sigue sirviendo.
  health:
    mail:
      enabled: false

server:
  port: 8080
  # En Azure la petición llega a través de un proxy, que pasa la dirección del cliente en
  # X-Forwarded-For. Con native, Tomcat la toma de ahí para getRemoteAddr, de la que depende el
  # límite de intentos de login.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Tomcat solo confía en X-Forwarded-For si la conexión viene de una de estas direcciones.
      # El proxy de App Service se conecta desde 169.254.x.x (verificado en el log de accesos
      # del despliegue). Por defecto Tomcat confía además en 10.x, 172.16-31.x, 192.168.x y
      # 127.x, que acá no hacen falta. Azure agrega la dirección real al final del header, y
      # Tomcat toma la última que no es de un proxy de confianza: un X-Forwarded-For inventado
      # por el cliente queda antes y no cuenta.
      internal-proxies: '169\.254\.\d{1,3}\.\d{1,3}'

# La implementación de EmailSender la elige gastos.email.sender (variable EMAIL_SENDER).
# A propósito no tiene valor por defecto: "console" escribe los correos en el log, con sus
# enlaces y tokens de un solo uso, así que un despliegue que se olvide de definirla tiene que
# fallar al arrancar y no quedar registrando tokens. En desarrollo la fija el perfil dev
# (application-dev.yaml) y en las pruebas de integración, IntegrationTest.
#
# WEB_URL, la dirección del cliente web para los enlaces de los correos, también.
#
# La clave de firma del token de sesión sigue el mismo criterio: vacía si falta JWT_SECRET, y
# JwtProperties rechaza el arranque con una clave vacía o corta (RNF-07).
#
# Cada variable de entorno se mapea acá de forma explícita. Sin el mapeo, Spring solo reconoce el
# nombre derivado de la propiedad (GASTOS_EMAIL_SENDER), no el que documenta el README: la app no
# la leería y, en el caso del correo, no arrancaría. Lo verifica ApplicationYamlTest.
gastos:
  email:
    sender: ${EMAIL_SENDER:}
    from: ${EMAIL_FROM:}
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 7d
  # Límite de intentos fallidos de login (RNF-06). Ver LoginAttemptLimiter.
  login-limit:
    window: 15m
    max-per-email-and-ip: 10
    max-per-ip: 50
    max-per-email: 100
  # Límites sobre los códigos de invitación (RNF-30). Ver InvitationAttemptLimiter y
  # HouseholdService.createInvitation.
  invitation-limit:
    window: 15m
    max-failures-per-user: 10
    max-failures-per-ip: 50
    max-active-per-household: 10
  # Límite de altas de cuenta por dirección IP (RNF-31). Cuentan todos los intentos que llegan al
  # alta, no solo los fallidos. Ver RegistrationAttemptLimiter.
  registration-limit:
    window: 1h
    max-per-ip: 20
  # Límite de pedidos de enlaces por correo, restablecimiento y reenvío de verificación (RNF-32).
  # Ver EmailLinkLimiter.
  email-link-limit:
    window: 1h
    max-per-email: 5
    max-per-ip: 20
  # Tokens de cliente máquina (RNF-33): tope de vigentes por persona y de pedidos de emisión por
  # persona y por ventana. Ver MachineTokenService y MachineTokenIssueLimiter.
  machine-token-limit:
    max-active-per-user: 10
    window: 1h
    max-issues-per-user: 20
  # Dirección del cliente web, para los enlaces de los correos. Sin valor por defecto, como
  # EMAIL_SENDER: un despliegue que no la defina no arranca, en lugar de mandar enlaces a localhost.
  web:
    url: ${WEB_URL:}
  # Orígenes del cliente web, separados por coma. Vacío: ningún otro origen puede llamar a la API.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
